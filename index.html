<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Red Panda Mood Button</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <header>
      <p class="eyebrow">Red Panda Mood Button</p>
      <h1>How is the red panda feeling today?</h1>
      <p class="description">Tap the button to receive a random, wholesome mood update from our fluffy friend.</p>
    </header>

    <section class="action">
      <img id="panda-img" class="panda-image" alt="Playful red panda enjoying the day" />
      <button id="mood-button" type="button">Reveal the Mood</button>
      <div id="message" aria-live="polite" class="message">Click the button to start!</div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
